    <title>React Dimensions — Interfaces with depth</title>
    <meta name="description" content="Physically based 3D components for React: clear-coat, brushed steel, real light and spring physics." />
    <meta name="theme-color" content="#0d0c11" />
    <script>
      try {
        var t = localStorage.getItem("rd-theme") || "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
